[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-mcp-server"
version = "0.1.0"
description = "Vision MCP Server using Groq API with LLaVA"
authors = [{name = "Vision MCP"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "groq>=0.5.0",
    "pillow>=10.0.0",
    "aiofiles>=23.2.0",
]

[project.scripts]
vision-mcp-server = "vision_mcp_server.server:main"
